name: Live Agent Model Experiment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_70_COACH_MODEL_CASES to confirm live model usage
        required: true
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: live-agent-model-experiment-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-coach-model-experiment:
    if: >-
      inputs.confirmation == 'RUN_70_COACH_MODEL_CASES' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/run-live-agent-model-experiment-'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN_LIVE_AGENT_RESPONSE_BENCHMARK: 'true'
      BASE44_APP_ID: '69504b725a07f5aa75aeaf7d'
      BASE44_LIVE_TEST_EMAIL: ${{ secrets.BASE44_LIVE_TEST_EMAIL }}
      BASE44_LIVE_TEST_PASSWORD: ${{ secrets.BASE44_LIVE_TEST_PASSWORD }}
      LIVE_AGENT_RESPONSE_LOGICAL_AGENT: 'ai_coach'
      LIVE_AGENT_RESPONSE_TARGET_AGENT: 'ai_coach_benchmark'
      LIVE_AGENT_RESPONSE_EXPECTED_CASES: '70'
      LIVE_AGENT_RESPONSE_EXPERIMENT_LABEL: ${{ github.head_ref || github.ref_name }}
      LIVE_AGENT_RESPONSE_OUTPUT_DIR: test-results/live-agent-model-experiment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate production agent configuration and benchmark catalog
        run: |
          npm run check:agents
          npm run check:agent-benchmark

      - name: Run 70 live coach cases against the isolated benchmark agent
        run: node scripts/run-live-agent-response-benchmark.mjs

      - name: Upload redacted model-comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-agent-model-experiment
          path: test-results/live-agent-model-experiment/
          if-no-files-found: warn
          retention-days: 14
