name: Private Agent Response Review Rerun 3

on:
  push:
    branches:
      - codex/private-agent-response-review-rerun3-20261009

permissions:
  contents: read

jobs:
  capture-encrypted-synthetic-responses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE44_LIVE_TEST_EMAIL: ${{ secrets.BASE44_LIVE_TEST_EMAIL }}
      BASE44_LIVE_TEST_PASSWORD: ${{ secrets.BASE44_LIVE_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture verified synthetic conversations
        run: node scripts/private-review-live-conversations-r3.mjs
      - name: Encrypt before upload
        run: |
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in test-results/private-agent-review/conversations.json \
            -out test-results/private-agent-review/conversations.cms \
            .github/private-agent-review-public-r3.pem
          rm test-results/private-agent-review/conversations.json
      - name: Upload encrypted evidence only
        uses: actions/upload-artifact@v4
        with:
          name: private-agent-response-review-r3-encrypted
          path: test-results/private-agent-review/conversations.cms
          if-no-files-found: error
          retention-days: 1
