name: Live Crisis Production Retest

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: live-crisis-production-retest-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crisis-retest:
    name: Seven-language Chat and Coach hard gates
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/run-live-crisis-production-retest-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the deployed production crisis retest
        env:
          RUN_LIVE_CRISIS_RETEST: 'true'
          PLAYWRIGHT_TEST_BASE_URL: https://mindful-path-production-7704.up.railway.app
        run: >-
          npx playwright test
          tests/e2e/live-crisis-production-retest.spec.ts
          --project=web-desktop
          --workers=1
          --reporter=line

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-crisis-production-retest
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30
