name: Live Agent Response Benchmark

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_140_LIVE_CASES to confirm live model usage
        required: true
        type: string
  push:
    branches:
      - 'codex/run-live-agent-response-benchmark-*'

permissions:
  contents: read

concurrency:
  group: live-agent-response-benchmark
  cancel-in-progress: false

jobs:
  live-response-benchmark:
    if: github.event_name == 'push' || inputs.confirmation == 'RUN_140_LIVE_CASES'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUN_LIVE_AGENT_RESPONSE_BENCHMARK: 'true'
      BASE44_APP_ID: '69504b725a07f5aa75aeaf7d'
      BASE44_LIVE_TEST_EMAIL: ${{ secrets.BASE44_LIVE_TEST_EMAIL }}
      BASE44_LIVE_TEST_PASSWORD: ${{ secrets.BASE44_LIVE_TEST_PASSWORD }}
      LIVE_AGENT_RESPONSE_OUTPUT_DIR: test-results/live-agent-response

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate agent configuration and benchmark catalog
        run: |
          npm run check:agents
          npm run check:agent-benchmark

      - name: Run 140 live model-response cases and preliminary review
        run: node scripts/run-live-agent-response-benchmark.mjs

      - name: Upload redacted review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-agent-response-benchmark
          path: test-results/live-agent-response/
          if-no-files-found: warn
          retention-days: 14
